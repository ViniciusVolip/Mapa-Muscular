<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mapa Muscular</title>
<meta name="theme-color" content="#F8F6F1">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F8F6F1;--surface:#fff;--sunk:#EFEBE1;--line:#E4DFD2;--fg:#22302B;--muted:#6E6A5F;--primary:#2F5D50;--ac:#F0735A;--mint:#D6ECDD;--cream:#FBEDC9;--pink:#FADADF;--lilac:#E6E0F8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Figtree,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(108px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:8px 0 12px;line-height:1.15}h1{font-size:28px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:11px 12px}
.seg{display:flex;background:var(--sunk);border-radius:99px;padding:4px}.seg button{flex:1;border:0;background:none;border-radius:99px;padding:9px;font-weight:700}.seg .on{background:var(--surface);box-shadow:0 2px 8px #4632181a}
.stage{position:relative;background:var(--surface);border-radius:28px;margin:12px 0;padding:14px 0 50px;box-shadow:0 6px 18px #46371e14}
.body{display:block;height:min(58vh,470px);width:100%}
.mus{fill:#F7B8A6;stroke:#fff;stroke-width:1.2;cursor:pointer;transition:fill .15s}.mus:hover{fill:#F29C86}.mus.on{fill:#D9482F}
.fib path{fill:none;stroke:#8C2F1F;stroke-opacity:.3;stroke-width:1;stroke-linecap:round;pointer-events:none}
.tag{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;border-radius:99px;padding:6px 16px;font-weight:700;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px}.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
#res{scroll-margin-top:12px}
.list{display:grid;gap:10px;margin:8px 0 16px}
.ex{display:flex;gap:12px;align-items:center;text-align:left;border:0;background:var(--surface);border-radius:22px;padding:10px;box-shadow:0 4px 12px #46371e12}
.ex span{display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:0}.ex small,.muted{color:var(--muted);font-size:14px}
.mini{width:96px;height:78px;flex:none;border-radius:16px;background:var(--cream)}
.m-peito,.m-ombros,.m-triceps{background:var(--pink)}.m-dorsais,.m-trapezio,.m-biceps,.m-antebraco{background:var(--lilac)}.m-quadriceps,.m-gluteos,.m-posterior,.m-adutores,.m-panturrilha{background:var(--mint)}
.lv{font-style:normal;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--mint)}.l2{background:var(--cream)}.l3{background:var(--pink)}
.empty{text-align:center;color:var(--muted);background:var(--sunk);border-radius:22px;padding:24px}
.nav{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(500px,calc(100% - 20px));display:flex;background:var(--surface);border-radius:28px;padding:6px;box-shadow:0 8px 28px #46371e2b}
.nav button{flex:1;border:0;background:none;border-radius:22px;padding:7px 0;font-size:12px;font-weight:700;color:var(--muted);position:relative}.nav button span{display:block;font-size:20px;line-height:1.3}.nav .on{background:var(--cream);color:var(--fg)}
#badge{position:absolute;top:2px;right:10px;background:var(--ac);color:var(--fg);border-radius:99px;font-size:11px;font-style:normal;padding:0 6px}#badge:empty{display:none}
#sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}#sheet[hidden]{display:none}
.panel{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
.anim{background:var(--surface);border-radius:28px;padding:10px;text-align:center}.anim svg{width:100%;max-height:300px;display:block}
li{margin-bottom:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row select{flex:1 1 140px}.between{justify-content:space-between;margin-top:0}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:2px solid var(--primary);background:var(--primary);color:#fff;border-radius:99px;padding:13px;font-weight:700;margin:10px 0}.btn.ghost{background:none;color:var(--fg);border-color:var(--line)}
.block{border-radius:24px;padding:16px;margin:12px 0}.block p{margin:4px 0 0}.mint{background:var(--mint)}.cream{background:var(--cream)}.pink{background:var(--pink)}.lilac{background:var(--lilac)}
.item{background:var(--surface);border-radius:22px;padding:14px;margin:10px 0}.item header{display:flex;justify-content:space-between;gap:8px}.link,.x{border:0;background:none;padding:0;font-weight:700;text-align:left}.link{text-decoration:underline;text-underline-offset:3px}.x{padding:0 6px;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.nums label{font-size:12px;color:var(--muted);min-width:0}.nums input{font-size:16px;color:var(--fg)}
.sets{display:flex;gap:8px;flex-wrap:wrap}.set{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:700}.set.on{background:#8FD0B4;border-color:#8FD0B4}
.progress{height:14px;background:var(--sunk);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--ac);border-radius:99px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .block{margin:0}.stats b{display:block;font:800 34px "Bricolage Grotesque",system-ui}
.note{font-size:13px;color:var(--muted)}
#toast{position:fixed;z-index:20;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:#fff;border-radius:18px;padding:10px 16px;width:max-content;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.form label{font-size:13px;font-weight:600;min-width:0}
.day{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}.day span{flex:0 0 80px}.heat .day span{flex:1}.day select{flex:1}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}.bars i{display:block;width:100%;max-width:34px;background:var(--ac);border-radius:8px 8px 3px 3px}.bars small{font-size:11px;color:var(--muted)}
summary{cursor:pointer;color:var(--muted);margin:6px 0}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin:10px 0}.opt small{display:block;color:var(--muted)}.opt.on{border-color:var(--primary);background:var(--mint)}
.age{text-align:center}.age b{font:800 56px "Bricolage Grotesque",system-ui;color:var(--primary)}input[type=range]{padding:0;border:0;background:none;accent-color:var(--primary);height:40px}
.wbtns{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin-top:16px}
.gcard h2{margin-top:10px}.gcard ul{padding-left:20px}.gcard li{margin-bottom:4px}.pill{display:inline-block;background:var(--surface);border-radius:99px;padding:3px 12px;font-weight:700}.howtxt{background:var(--surface);border-radius:16px;padding:12px}
.up{font-weight:700;font-size:14px;background:var(--mint);border-radius:12px;padding:6px 10px}
</style></head><body>
<main id="view"></main>
<nav class="nav" aria-label="Seções"><button data-tab="mapa"><span>🦍</span>Mapa</button><button data-tab="lista"><span>🔎</span>Exercícios</button><button data-tab="treino"><span>🏋️</span>Treino<i id="badge"></i></button><button data-tab="planos"><span>🗓️</span>Planos</button><button data-tab="hist"><span>📈</span>Progresso</button></nav>
<div id="sheet" hidden></div><div id="toast" role="status"></div>
<script>
// músculos
const M={peito:"Peito",ombros:"Ombros",biceps:"Bíceps",triceps:"Tríceps",antebraco:"Antebraço",abdomen:"Abdômen",obliquos:"Oblíquos",quadriceps:"Quadríceps",adutores:"Adutores",panturrilha:"Panturrilha",trapezio:"Trapézio",dorsais:"Dorsais",lombar:"Lombar",gluteos:"Glúteos",posterior:"Posterior de coxa"};
const EQ={corpo:"Peso do corpo",halter:"Halteres",barra:"Barra",maquina:"Máquina",polia:"Polia",elastico:"Elástico"};
const LV=["","Iniciante","Intermediário","Avançado"];
// [id, músculo, nome, equipamento, nível, movimento, passos, atenção, outros músculos]
const RAW=[
["flexao","peito","Flexão de braço","corpo",1,"flexao",["Apoie as mãos um pouco além da largura dos ombros, com o corpo em linha reta.","Desça o peito até perto do chão, cotovelos a cerca de 45° do tronco.","Empurre o chão até estender os braços."],"Não deixe o quadril cair. Se estiver difícil, apoie os joelhos.","triceps,ombros"],
["flexincl","peito","Flexão com mãos elevadas","corpo",1,"flexao",["Apoie as mãos em um banco ou mesa firme.","Desça o peito em direção ao apoio, mantendo o corpo alinhado.","Estenda os braços para voltar."],"Confira se o apoio não escorrega.","triceps"],
["supbarra","peito","Supino reto com barra","barra",2,"supino",["Deite no banco com os pés no chão e as escápulas juntas.","Desça a barra com controle até o meio do peito.","Empurre até estender os braços."],"Use travas de segurança ou peça apoio de alguém.","triceps,ombros"],
["suphalter","peito","Supino com halteres","halter",1,"supino",["Deite no banco com um halter em cada mão, na altura do peito.","Empurre os halteres para cima, aproximando-os.","Desça devagar até sentir o peito alongar."],"Punhos alinhados com os antebraços.","triceps,ombros"],
["cruci","peito","Crucifixo com halteres","halter",2,"supino",["Deitado, comece com os braços estendidos acima do peito e cotovelos levemente dobrados.","Abra os braços em arco até a linha do tronco.","Feche o arco contraindo o peito."],"Use carga leve e não desça além do conforto do ombro.","ombros"],
["crossover","peito","Crucifixo na polia","polia",2,"empurrafrente",["Ajuste as polias na altura dos ombros e dê um passo à frente.","Com cotovelos levemente dobrados, junte as mãos diante do peito.","Volte devagar."],"O tronco fica parado; só os braços se movem.","ombros"],

["desenv","ombros","Desenvolvimento com halteres","halter",1,"desenvolvimento",["Sentado ou em pé, halteres na altura dos ombros.","Empurre para cima até quase estender os cotovelos.","Desça até a altura das orelhas ou ombros."],"Contraia o abdômen para não arquear a lombar.","triceps,trapezio"],
["militar","ombros","Desenvolvimento militar","barra",2,"desenvolvimento",["Em pé, barra apoiada à frente dos ombros.","Empurre a barra acima da cabeça, levando o rosto levemente para trás na passagem.","Desça com controle."],"Glúteos e abdômen firmes o tempo todo.","triceps,trapezio"],
["lateral","ombros","Elevação lateral","halter",1,"lateral",["Em pé, halteres ao lado do corpo.","Eleve os braços para os lados até a altura dos ombros.","Desça devagar."],"Sem balançar o tronco; prefira carga leve.","trapezio"],
["frontal","ombros","Elevação frontal","halter",1,"frontal",["Em pé, halteres à frente das coxas.","Eleve os braços à frente até a altura dos ombros.","Volte com controle."],"Não use impulso do quadril.","peito"],
["latelast","ombros","Elevação lateral com elástico","elastico",1,"lateral",["Pise no meio do elástico e segure as pontas.","Abra os braços até a altura dos ombros.","Retorne resistindo ao elástico."],"Confira se o elástico está inteiro.","trapezio"],
["pike","ombros","Flexão pike","corpo",2,"pike",["Forme um V invertido, mãos e pés no chão.","Dobre os cotovelos levando a cabeça à frente das mãos.","Empurre de volta."],"Pescoço relaxado; não bata a cabeça.","triceps"],

["rosca","biceps","Rosca direta com barra","barra",1,"rosca",["Em pé, barra com as palmas para a frente.","Dobre os cotovelos levando a barra em direção aos ombros.","Desça até estender os braços."],"Cotovelos parados ao lado do corpo.","antebraco"],
["roscaalt","biceps","Rosca alternada","halter",1,"rosca",["Em pé, um halter em cada mão.","Suba um braço girando a palma para cima.","Desça e troque de lado."],"Não incline o tronco para ajudar.","antebraco"],
["martelo","biceps","Rosca martelo","halter",1,"rosca",["Segure os halteres com as palmas voltadas uma para a outra.","Dobre os cotovelos mantendo a pegada neutra.","Desça devagar."],"Movimento completo, sem pressa.","antebraco"],
["roscapolia","biceps","Rosca na polia baixa","polia",1,"rosca",["De frente para a polia baixa, segure a barra.","Dobre os cotovelos até contrair o bíceps.","Volte controlando o cabo."],"Fique a um passo da polia.","antebraco"],
["roscaelast","biceps","Rosca com elástico","elastico",1,"rosca",["Pise no elástico e segure as pontas.","Dobre os cotovelos até a altura do peito.","Desça lentamente."],"Mantenha os punhos retos.","antebraco"],
["supinada","biceps","Barra fixa supinada","corpo",3,"barrafixa",["Pendure-se com as palmas voltadas para você.","Puxe até o queixo passar da barra.","Desça até estender os braços."],"Sem balanço. Use elástico de apoio se precisar.","dorsais"],

["banco","triceps","Mergulho no banco","corpo",1,"mergulho",["Mãos na borda de um banco firme, pernas à frente.","Dobre os cotovelos descendo o quadril.","Empurre até estender os braços."],"Não desça além do conforto dos ombros.","peito,ombros"],
["pulley","triceps","Tríceps na polia","polia",1,"pulley",["De frente para a polia alta, cotovelos junto ao corpo.","Estenda os braços empurrando a barra para baixo.","Volte até cerca de 90°."],"Só o antebraço se move.",""],
["frances","triceps","Tríceps francês","halter",2,"frances",["Segure um halter com as duas mãos acima da cabeça.","Dobre os cotovelos levando o peso atrás da cabeça.","Estenda os braços."],"Cotovelos apontados para a frente e abdômen firme.",""],
["testa","triceps","Tríceps testa","barra",2,"supino",["Deitado, braços estendidos segurando a barra.","Dobre apenas os cotovelos, levando a barra perto da testa.","Estenda de volta."],"Carga moderada e atenção total à barra.",""],
["diamante","triceps","Flexão diamante","corpo",3,"flexao",["Mãos próximas, polegares e indicadores formando um losango.","Desça o peito até as mãos.","Estenda os braços."],"Pare se sentir dor no punho.","peito"],

["punho","antebraco","Rosca de punho","halter",1,"punho",["Sentado, antebraços apoiados nas coxas, palmas para cima.","Suba o peso dobrando só os punhos.","Desça devagar."],"Carga leve, amplitude confortável.",""],
["punhoinv","antebraco","Rosca de punho inversa","halter",1,"punho",["Mesma posição, palmas para baixo.","Eleve o dorso das mãos.","Volte com controle."],"Use menos peso que na versão normal.",""],
["fazendeiro","antebraco","Caminhada do fazendeiro","halter",1,"caminhada",["Segure um halter pesado em cada mão.","Caminhe com o tronco ereto por 20 a 40 metros.","Apoie os pesos com as pernas, sem curvar as costas."],"Deixe o caminho livre.","trapezio,abdomen"],
["pendura","antebraco","Suspensão na barra","corpo",1,"pendura",["Segure a barra com as mãos na largura dos ombros.","Fique pendurado com os ombros ativos.","Segure de 15 a 40 segundos."],"Desça antes de a pegada falhar de vez.","dorsais"],

["crunch","abdomen","Abdominal curto","corpo",1,"abdominal",["Deitado, joelhos dobrados e pés no chão.","Tire os ombros do chão aproximando as costelas do quadril.","Desça devagar."],"Não puxe o pescoço com as mãos.",""],
["prancha","abdomen","Prancha","corpo",1,"prancha",["Apoie antebraços e pontas dos pés.","Mantenha cabeça, quadril e calcanhares alinhados.","Segure de 20 a 60 segundos respirando."],"Encerre quando o quadril começar a cair.","obliquos,lombar"],
["elevpernas","abdomen","Elevação de pernas deitado","corpo",2,"elevpernas",["Deitado, pernas estendidas.","Suba as pernas até perto da vertical.","Desça sem encostar no chão."],"Se a lombar arquear, dobre os joelhos.",""],
["abpolia","abdomen","Abdominal na polia","polia",2,"abpolia",["Ajoelhado diante da polia alta, segure a corda perto da cabeça.","Enrole o tronco para baixo.","Volte controlando."],"O movimento vem da coluna, não do quadril.",""],
["mountain","abdomen","Escalador","corpo",2,"escalador",["Comece na posição alta de flexão.","Leve um joelho ao peito e troque rapidamente.","Mantenha o ritmo por tempo."],"Ombros acima das mãos.","quadriceps,ombros"],

["russo","obliquos","Giro russo","corpo",2,"russo",["Sentado, tronco inclinado para trás e joelhos dobrados.","Gire o tronco levando as mãos de um lado ao outro.","Alterne com controle."],"Mantenha o peito aberto.","abdomen"],
["latprancha","obliquos","Prancha lateral","corpo",2,"pranchalat",["Deite de lado, apoiado no antebraço.","Eleve o quadril alinhando o corpo.","Segure e troque de lado."],"Cotovelo logo abaixo do ombro.","abdomen"],
["bicicleta","obliquos","Abdominal bicicleta","corpo",2,"escaladordeitado",["Deitado, mãos ao lado da cabeça e pernas no ar.","Aproxime um cotovelo do joelho oposto.","Alterne os lados."],"Devagar funciona melhor que rápido.","abdomen"],
["inclat","obliquos","Inclinação lateral com halter","halter",1,"inclinalat",["Em pé, um halter em uma das mãos.","Incline o tronco para o lado do peso.","Volte à posição ereta usando o lado oposto."],"Não gire nem incline para a frente.","lombar"],

["agach","quadriceps","Agachamento livre","corpo",1,"agachamento",["Pés na largura dos ombros, pontas levemente para fora.","Leve o quadril para trás e para baixo.","Suba empurrando o chão com o pé inteiro."],"Joelhos acompanham a direção dos pés.","gluteos"],
["agachbarra","quadriceps","Agachamento com barra","barra",2,"agachamento",["Apoie a barra no trapézio e saia do suporte.","Agache até onde mantiver a coluna neutra.","Suba mantendo o tronco firme."],"Ajuste as barras de segurança do suporte.","gluteos,lombar"],
["goblet","quadriceps","Agachamento goblet","halter",1,"agachamento",["Segure um halter junto ao peito.","Agache entre os joelhos.","Suba mantendo o peito alto."],"Calcanhares no chão.","gluteos"],
["leg","quadriceps","Leg press","maquina",1,"legpress",["Sente com a lombar apoiada e os pés na plataforma.","Desça a plataforma dobrando os joelhos.","Empurre sem travar os joelhos."],"O quadril não deve descolar do banco.","gluteos"],
["extensora","quadriceps","Cadeira extensora","maquina",1,"extensora",["Ajuste o rolo logo acima dos pés.","Estenda os joelhos.","Desça devagar."],"Sem chutar o peso.",""],
["afundo","quadriceps","Afundo","corpo",1,"afundo",["Dê um passo largo à frente.","Desça o joelho de trás em direção ao chão.","Empurre com a perna da frente e volte."],"Tronco ereto e passo estável.","gluteos"],

["sumo","adutores","Agachamento sumô","halter",1,"agachamento",["Pés bem afastados, pontas para fora, halter entre as pernas.","Agache mantendo os joelhos abertos.","Suba contraindo glúteos e parte interna das coxas."],"Não deixe os joelhos caírem para dentro.","gluteos,quadriceps"],
["adutora","adutores","Cadeira adutora","maquina",1,"adutora",["Sente com as almofadas na parte interna dos joelhos.","Feche as pernas.","Abra devagar."],"Comece com amplitude confortável.",""],
["copenhague","adutores","Prancha Copenhague","corpo",3,"pranchalat",["De lado, apoie a perna de cima em um banco.","Eleve o quadril apoiado no antebraço.","Segure e troque de lado."],"Comece apoiando o joelho, não o pé.","obliquos"],
["afundolat","adutores","Afundo lateral","corpo",1,"afundo",["Dê um passo largo para o lado.","Sente sobre a perna que se moveu, mantendo a outra estendida.","Empurre de volta."],"Pés apontados para a frente.","quadriceps,gluteos"],

["panturr","panturrilha","Elevação de panturrilha em pé","corpo",1,"panturrilha",["Em pé, de preferência com a ponta dos pés em um degrau.","Suba o máximo nas pontas dos pés.","Desça alongando."],"Segure em um apoio para equilibrar.",""],
["panturrhalt","panturrilha","Panturrilha com halteres","halter",1,"panturrilha",["Em pé, um halter em cada mão.","Eleve os calcanhares e pause no alto.","Desça devagar."],"Não quique no fundo.","antebraco"],
["panturrmaq","panturrilha","Panturrilha sentado","maquina",1,"panturrsent",["Sentado, almofada sobre os joelhos.","Eleve os calcanhares.","Desça até alongar."],"Pause em cima e embaixo.",""],

 <div class="seg"><button data-side="f" class="${state.side==="f"?"on":""}">Frente</button><button data-side="b" class="${state.side==="b"?"on":""}">Costas</button></div>
 <div class="stage">${bodySVG(state.side)}<div class="tag">${state.mus?M[state.mus]:"Escolha no desenho"}</div></div>
 ${chips("mus",Object.entries(M),state.mus)}
 ${state.mus?`<section id="res"><h2>${M[state.mus]}</h2>${filters()}<button class="chip${state.sec2?" on":""}" data-act="sec2" aria-pressed="${state.sec2}">Incluir como músculo auxiliar</button><div class="list">${listHTML()}</div></section>`:""}`},
lista(){return `<h1>Exercícios</h1><input id="q" type="search" placeholder="Buscar exercício, músculo ou equipamento" value="${state.q.replace(/[&"<]/g,"")}" aria-label="Buscar">${filters()}<div class="list" id="lst">${listHTML()}</div>`},
treino(){
 const total=D.plan.reduce((a,p)=>a+p.s,0),done=D.plan.reduce((a,p)=>a+Math.min(p.log.length,p.s),0);
 const today=D.rout.find(r=>r.id===D.week[new Date().getDay()]);
 const items=D.plan.map((p,i)=>{const x=byId(p.id),b=best(p.id),l=sessions(p.id).at(-1);return `<article class="item"><header><button class="link" data-open="${x.id}">${x.n}</button><button class="x" data-del="${i}" aria-label="Remover ${x.n}">✕</button></header>
 ${p.up&&!p.log.length?`<p class="up">⬆ Progressão: ${esc(p.up)}</p>`:""}
 ${l?`<p class="muted">Última vez: ${l.log.map(a=>setTxt(p.id,a)).join(" · ")}</p>`:""}
 <div class="nums">${[["s","Séries"],["r",unit(p.id)],["kg","Carga (kg)"]].map(([k,n])=>`<label>${n}<input type="number" inputmode="decimal" min="0" max="999" step="any" data-i="${i}" data-k="${k}" value="${p[k]}"></label>`).join("")}</div>
 <div class="sets">${Array.from({length:p.s},(_,j)=>`<button class="set${j<p.log.length?" on":""}" data-set="${i}:${j}" aria-label="Série ${j+1}" aria-pressed="${j<p.log.length}">${j<p.log.length?"✓":j+1}</button>`).join("")}</div>
 ${p.log.length?`<p class="muted">Feito: ${p.log.map(a=>setTxt(p.id,a)).join(" · ")}</p>`:""}</article>`}).join("");
 return `<h1>Meu treino</h1>
 ${today?`<div class="block mint"><b>Hoje: ${esc(today.name)}</b><button class="btn" data-load="${today.id}">${state.confirm==="load:"+today.id?"Toque de novo para substituir":"Carregar treino de hoje"}</button></div>`:""}
 ${D.plan.length?`<h2>${esc(D.name||"Treino livre")}</h2><div class="progress" role="progressbar" aria-valuenow="${done}" aria-valuemax="${total}"><i style="width:${total?done/total*100:0}%"></i></div><p class="muted">${done} de ${total} séries. Ajuste a carga antes de marcar cada série.</p>
 <div class="block cream"><b>Descanso</b><div class="row">${[30,60,90,120,180].map(s=>`<button class="chip${state.sec===s?" on":""}" data-sec="${s}">${s}s</button>`).join("")}</div><button class="btn" data-act="timer" id="tbtn">${timerLabel()}</button></div>
 ${items}<button class="btn" data-act="finish">Concluir treino</button>
 <label class="muted" for="rname">Nome da rotina</label><input id="rname" maxlength="40" value="${esc(D.name)}" placeholder="Ex.: Peito e tríceps"><button class="btn ghost" data-act="saver">Salvar como rotina</button>
 <button class="btn ghost" data-act="clear">${state.confirm==="clear"?"Toque de novo para limpar":"Limpar treino"}</button>`:`<p class="empty">Seu treino está vazio. Carregue uma rotina em Planos ou adicione exercícios pela lista.</p>`}`},
planos(){
 if(state.wiz)return wizard();
 return `<h1>Gerador</h1>${genCards()}
 <h2 id="myr">Minhas rotinas</h2>${D.rout.length?D.rout.map(o=>`<article class="item"><b>${esc(o.name)}</b><details><summary>${o.items.length} exercícios</summary><ul>${o.items.map(p=>`<li><button class="link" data-open="${p.id}">${byId(p.id).n}</button> · ${p.s} × ${p.r} ${TIMED[p.id]?unit(p.id).toLowerCase():""}</li>`).join("")}</ul></details>
 <div class="row"><button class="chip on" data-load="${o.id}">${state.confirm==="load:"+o.id?"Confirmar troca":"Treinar"}</button><button class="chip" data-rm="${o.id}">${state.confirm==="rm:"+o.id?"Confirmar exclusão":"Excluir"}</button></div></article>`).join(""):`<p class="empty">Gere um plano ou salve o treino atual como rotina.</p>`}
 ${D.rout.length?`<h2>Minha semana</h2><div class="item">${[1,2,3,4,5,6,0].map(i=>`<label class="day"><span>${WD[i]}</span><select data-day="${i}"><option value="">Descanso</option>${D.rout.map(o=>`<option value="${o.id}"${D.week[i]===o.id?" selected":""}>${esc(o.name)}</option>`).join("")}</select></label>`).join("")}</div>`:""}`},
hist(){
 const w=D.hist.filter(h=>h.d>=daysAgo(6)),vol=w.reduce((a,h)=>a+h.ex.reduce((b,e)=>b+(TIMED[e.id]?0:e.log.reduce((c,[r,k])=>c+r*k,0)),0),0);
 const weeks=Array.from({length:6},(_,i)=>weekStart(daysAgo((5-i)*7))),ms=muscleSets(),top=Math.max(1,...Object.values(ms));
 const recs=[...new Set(D.hist.flatMap(h=>h.ex.map(e=>e.id)))].map(id=>[id,best(id)]);
 return `<h1>Progresso</h1><div class="stats"><div class="block pink"><b>${w.length}</b><small>treinos em 7 dias</small></div><div class="block lilac"><b>${w.reduce((a,h)=>a+h.sets,0)}</b><small>séries em 7 dias</small></div><div class="block cream"><b>${num(vol)}</b><small>kg de volume em 7 dias</small></div><div class="block mint"><b>${streak()}</b><small>semanas seguidas</small></div></div>
 <h2>Séries por semana</h2><div class="item">${bars(weeks.map(s=>D.hist.filter(h=>weekStart(h.d)===s).reduce((a,h)=>a+h.sets,0)),weeks.map(s=>s.slice(8)+"/"+s.slice(5,7)),"Séries por semana")}</div>
 <h2>Músculos nos últimos 7 dias</h2><div class="seg"><button data-heat="f" class="${state.heat==="f"?"on":""}">Frente</button><button data-heat="b" class="${state.heat==="b"?"on":""}">Costas</button></div>
 <div class="stage heat">${bodySVG(state.heat,m=>ms[m]?`color-mix(in srgb,#B5301C ${Math.round(25+75*ms[m]/top)}%,#fff)`:"#D9D3C6")}<div class="tag">Mais escuro = mais séries</div></div>
 ${Object.keys(ms).length?`<div class="item">${Object.entries(ms).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`<div class="day"><span>${M[m]}</span><b>${num(v)}</b></div>`).join("")}<p class="note">Músculo auxiliar conta meia série.</p></div>`:""}
 <h2>Recordes pessoais</h2>${recs.length?recs.map(([id,b])=>`<article class="item"><button class="link" data-open="${id}">${byId(id).n}</button><p class="muted">${b.kg?`Maior carga: ${num(b.kg)} kg`:`Máximo: ${b.r} ${unit(id).toLowerCase()}`}${b.rm?` · 1RM estimado: ${num(b.rm)} kg`:""}</p></article>`).join(""):`<p class="empty">Conclua um treino para ver seus recordes.</p>`}
 <h2>Histórico</h2>${D.hist.length?D.hist.slice().reverse().slice(0,20).map(h=>`<article class="item"><b>${h.d.split("-").reverse().join("/")}</b> · ${h.sets} séries<p class="muted">${h.name?esc(h.name)+": ":""}${h.ids.map(i=>byId(i).n).join(", ")}</p></article>`).join(""):`<p class="empty">Nada registrado ainda.</p>`}
 <h3>Cópia de segurança</h3><p class="muted">Os dados ficam só neste aparelho.</p><button class="btn ghost" data-act="export">Copiar meus dados</button><textarea id="bk" rows="3" placeholder="Cole aqui uma cópia para restaurar" aria-label="Cópia para restaurar"></textarea><button class="btn ghost" data-act="import">${state.confirm==="import"?"Toque de novo para substituir tudo":"Restaurar"}</button>
 <p class="note">Conteúdo informativo, não substitui um profissional de educação física. Em caso de dor, pare.</p>`}
};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function render(){$("#view").innerHTML=V[state.tab]();document.querySelectorAll("[data-tab]").forEach(b=>{b.classList.toggle("on",b.dataset.tab===state.tab);b.setAttribute("aria-current",b.dataset.tab===state.tab?"page":"false")});$("#badge").textContent=D.plan.length||""}
// ---------- detalhe ----------
let raf=0,paused=false,lastFocus=null;
function openEx(id){
 const x=byId(id);if(!x)return;if(!state.open)lastFocus=document.activeElement;state.open=id;paused=matchMedia("(prefers-reduced-motion: reduce)").matches;
 const inPlan=D.plan.some(p=>p.id===id),fav=D.fav.includes(id);
 const ses=sessions(id).slice(-6),b=best(id),w=b&&b.kg>0;
 const evo=ses.length?`<h3>Sua evolução</h3><div class="item"><p class="muted">${w?"Maior carga (kg)":"Melhor série ("+unit(id).toLowerCase()+")"} por treino</p>${bars(ses.map(s=>Math.max(...s.log.map(a=>a[w?1:0]))),ses.map(s=>s.d.slice(8)+"/"+s.d.slice(5,7)),"Evolução")}</div>`:"";
 $("#sheet").innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="${x.n}"><div class="row between"><button class="chip" data-act="close">← Voltar</button><button class="chip${fav?" on":""}" data-fav="${id}">${fav?"★ Favorito":"☆ Favoritar"}</button></div>
 <h2>${x.n}</h2><p class="muted">${M[x.m]}${x.sec.length?" · ajuda: "+x.sec.map(s=>M[s].toLowerCase()).join(", "):""}<br>${EQ[x.eq]} · ${LV[x.lv]}</p>
 <div class="anim"><svg viewBox="0 0 200 155" id="fig" aria-label="Animação esquemática do movimento">${figure(x,paused?1:0)}</svg><button class="chip" data-act="pause" id="pz">${paused?"▶ Animar":"⏸ Pausar"}</button></div>
 <p class="note">${GOR[id]?"Em coral, os músculos trabalhados. Siga o passo a passo.":"Desenho esquemático. Siga o passo a passo."}</p><ol>${x.steps.map(s=>`<li>${s}</li>`).join("")}</ol><div class="block cream"><b>Atenção</b><p>${x.tip}</p></div>
 ${evo}<button class="btn" data-add="${id}">${inPlan?"Já está no treino ✓":"Adicionar ao treino"}</button>
 <a class="btn ghost" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent("como fazer "+x.n)}">Buscar vídeos no YouTube (usa internet)</a></div>`;
 $("#sheet").hidden=false;document.body.style.overflow="hidden";$("#sheet [data-act=close]").focus();
 cancelAnimationFrame(raf);let t0=null,acc=0;
 const tick=ts=>{if(t0!==null&&!paused){acc+=ts-t0;const f=$("#fig");if(f){if(GOR[x.id]){const[t,d]=phase(acc);f.innerHTML=figure(x,t,d)}else f.innerHTML=figure(x,(1-Math.cos(acc/2400*Math.PI*2))/2)}}t0=ts;raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);
}
function closeEx(){state.open=null;$("#sheet").hidden=true;document.body.style.overflow="";cancelAnimationFrame(raf);render();if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
// ---------- cronômetro ----------
let end=0,iv=0,ac=null;
function timerLabel(){return end?`⏱ ${Math.max(0,Math.ceil((end-Date.now())/1000))}s · parar`:"Iniciar descanso"}
function beep(){try{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(ac.currentTime+.5)}catch(e){}if(navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(e){}}
function timer(){if(end){end=0;clearInterval(iv)}else{try{ac=ac||new AudioContext();ac.resume()}catch(e){}end=Date.now()+state.sec*1000;iv=setInterval(()=>{if(Date.now()>=end){end=0;clearInterval(iv);beep();toast("Descanso encerrado. Próxima série!")}const b=$("#tbtn");if(b)b.textContent=timerLabel()},250)}const b=$("#tbtn");if(b)b.textContent=timerLabel()}
document.addEventListener("click",ev=>{
 const el=ev.target.closest("[data-tab],[data-side],[data-pick],[data-pickmins],[data-target],[data-how],[data-start],[data-gear],[data-load],[data-rm],[data-heat],[data-m],[data-mus],[data-eq],[data-lv],[data-open],[data-act],[data-add],[data-fav],[data-del],[data-set],[data-sec]");if(!el)return;const d=el.dataset;
 const keep=d.act==="clear"?"clear":d.act==="import"?"import":d.load?"load:"+d.load:d.rm?"rm:"+d.rm:d.act==="single"?"single":"";if(state.confirm!==keep)state.confirm="";
 if(d.tab){state.tab=d.tab;state.wiz=null;render();scrollTo(0,0)}
 else if(d.start){state.wiz={type:d.start,step:0};render();scrollTo(0,0)}
 else if(d.how){state.how=state.how===d.how?"":d.how;render()}
 else if(d.pick){const[k,v]=d.pick.split(":");state[k]=["goal","prio"].includes(k)?v:+v;if(k==="days")state.split=0;render()}
 else if(d.pickmins){state.mins=+d.pickmins;render()}
 else if(d.target){const i=state.targets.indexOf(d.target);i<0?state.targets.push(d.target):state.targets.splice(i,1);render()}
 else if(d.act==="next"){const n=STEPS[state.wiz.type][state.wiz.step];if(n==="Músculos"&&!state.targets.length)return toast("Escolha ao menos um músculo");state.wiz.step++;render();scrollTo(0,0)}
 else if(d.act==="back"){if(state.wiz.step)state.wiz.step--;else state.wiz=null;render();scrollTo(0,0)}
 else if(d.act==="allgear"){state.gear=Object.keys(EQ);render()}
 else if(d.act==="single")single()
 else if(d.side){state.side=d.side;render()}
 else if(d.heat){state.heat=d.heat;render()}
 else if(d.gear){const i=state.gear.indexOf(d.gear);i<0?state.gear.push(d.gear):state.gear.splice(i,1);render()}
 else if(d.load)load(d.load);
 else if(d.rm){if(state.confirm==="rm:"+d.rm){D.rout=D.rout.filter(r=>r.id!==d.rm);D.week=D.week.map(v=>v===d.rm?"":v);state.confirm="";save()}else state.confirm="rm:"+d.rm;render()}
 else if(d.act==="onlyfav"){state.fav=!state.fav;render()}
 else if(d.act==="sec2"){state.sec2=!state.sec2;render()}
 else if(d.m||d.mus){const m=d.m||d.mus;state.mus=state.mus===m?null:m;if(state.mus){if(!(state.side==="f"?FRONT:BACK)[m])state.side=state.side==="f"?"b":"f"}render();if(state.mus)$("#res").scrollIntoView({behavior:"smooth",block:"start"})}
 else if(d.eq!==undefined){if(!d.eq){state.eq=[];state.fav=false}else{const i=state.eq.indexOf(d.eq);i<0?state.eq.push(d.eq):state.eq.splice(i,1)}render()}
 else if(d.lv!==undefined){state.lv=+d.lv;render()}
 else if(d.open)openEx(d.open);
 else if(d.add){if(!D.plan.some(p=>p.id===d.add)){D.plan.push({id:d.add,s:3,r:TIMED[d.add]?30:12,kg:lastKg(d.add,0),log:[]});save();el.textContent="Já está no treino ✓";$("#badge").textContent=D.plan.length;toast("Adicionado ao treino")}}
 else if(d.fav){const i=D.fav.indexOf(d.fav);i<0?D.fav.push(d.fav):D.fav.splice(i,1);save();el.classList.toggle("on",i<0);el.textContent=i<0?"★ Favorito":"☆ Favoritar"}
 else if(d.del!==undefined){D.plan.splice(+d.del,1);save();render()}
 else if(d.set){const[i,j]=d.set.split(":").map(Number);const p=D.plan[i];if(j<p.log.length)p.log.length=j;else while(p.log.length<=j)p.log.push([p.r,p.kg]);save();render()}
 else if(d.sec){state.sec=+d.sec;render()}
 else if(d.act==="close")closeEx();
 else if(d.act==="pause"){paused=!paused;el.textContent=paused?"▶ Animar":"⏸ Pausar"}
 else if(d.act==="gen")generate();
 else if(d.act==="timer")timer();
 else if(d.act==="clear"){if(state.confirm==="clear"){D.plan=[];D.name="";state.confirm="";save()}else state.confirm="clear";render()}
 else if(d.act==="saver"){if(!D.plan.length)return;const name=($("#rname").value.trim()||"Meu treino").slice(0,40),items=D.plan.map(({id,s,r,kg})=>({id,s,r,kg})),o=D.rout.find(x=>x.name===name);if(o){o.items=items;o.auto=false}else D.rout.push({id:newId(),name,auto:false,items});D.name=name;save();render();toast(o?"Rotina atualizada":"Rotina salva em Planos")}
 else if(d.act==="finish"){const ex=D.plan.filter(p=>p.log.length).map(p=>({id:p.id,log:p.log.slice(0,p.s)})),sets=ex.reduce((a,e)=>a+e.log.length,0);if(!sets)return toast("Marque ao menos uma série");
  const prs=ex.filter(e=>{const b=best(e.id);return b&&(Math.max(...e.log.map(a=>a[1]))>b.kg||(!b.kg&&Math.max(...e.log.map(a=>a[0]))>b.r))}).length;
  D.hist.push({d:iso(new Date()),name:D.name,sets,ids:ex.map(e=>e.id),ex});D.plan.forEach(p=>p.log=[]);save();state.tab="hist";render();scrollTo(0,0);toast(prs?`Treino registrado. ${prs} recorde(s) novo(s)! 🏆`:"Treino registrado 💪")}
 else if(d.act==="export"){const t=JSON.stringify(D);const fb=()=>{$("#bk").value=t;$("#bk").select();toast("Copie o texto selecionado")};navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast("Dados copiados"),fb):fb()}
 else if(d.act==="import"){try{const r=JSON.parse($("#bk").value);if(!r||!Array.isArray(r.plan)||!Array.isArray(r.hist))throw 0;if(state.confirm!=="import"){const t=$("#bk").value;state.confirm="import";render();$("#bk").value=t;return}D=clean(r);state.confirm="";save();render();toast("Dados restaurados")}catch(e){toast("Essa cópia não é válida")}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.open)closeEx();if((e.key==="Enter"||e.key===" ")&&e.target.matches(".mus")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
document.addEventListener("input",e=>{if(e.target.id==="age"){state.age=+e.target.value;$("#ageval").textContent=state.age;$("#agenote").textContent=ageNote()}if(e.target.id==="q"){state.q=e.target.value;$("#lst").innerHTML=listHTML()}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="rname"){D.name=t.value.slice(0,40);save()}
 if(t.dataset.day!==undefined){D.week[+t.dataset.day]=t.value;save()}
 if(t.dataset.k){const p=D.plan[+t.dataset.i],k=t.dataset.k;p[k]=Math.min(999,Math.max(k==="kg"?0:1,+t.value||0));if(k==="s"){p.s=Math.min(20,Math.round(p.s));p.log=p.log.slice(0,p.s)}t.value=p[k];save();if(k==="s")render()}});
render();

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body></html>
